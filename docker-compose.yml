services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xenorasec-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/scans.db
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_SCANS=3
      - RATE_LIMIT_ENABLED=true
      - ALLOW_PRIVATE_IP_SCANNING=false
      - ALLOW_LOCALHOST_SCANNING=false
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://frontend
    volumes:
      - scans_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - xenorasec-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xenorasec-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - xenorasec-net

volumes:
  scans_data:
    driver: local

networks:
  xenorasec-net:
    driver: bridge
