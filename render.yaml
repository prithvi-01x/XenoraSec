services:
  # Backend (Docker)
  - type: web
    name: xenorasec-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/scans.db
      - key: DEBUG
        value: false
      - key: ALLOW_LOCALHOST_SCANNING
        value: false
      - key: ALLOW_PRIVATE_IP_SCANNING
        value: false
      - key: GLOBAL_SCAN_TIMEOUT
        value: 600
      - key: NMAP_TIMEOUT
        value: 180
      - key: NUCLEI_TIMEOUT
        value: 300
      - key: MAX_CONCURRENT_SCANS
        value: 3
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 10
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: ALLOWED_ORIGINS
        value: https://xenorasec-frontend.onrender.com,http://localhost:5173
      - key: PYTHONUNBUFFERED
        value: 1

  # Frontend (Static Site)
  - type: web
    name: xenorasec-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://xenorasec-backend.onrender.com
